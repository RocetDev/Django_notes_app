{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои заметки</title>
    <link rel="stylesheet" href="{% static 'notes/style.css' %}">
    <style>
        body {
            background-color: {{ theme_info.bg }};
            color: {{ theme_info.fg }};
            font-size: {{ font_size }}px;
        }
        a { color: {{ theme_info.fg }}; }
    </style>
</head>
<body>
    <header>
        <h1>Мои заметки</h1>
        <nav>
            <a href="{% url 'index' %}">Главная</a> |
            <a href="{% url 'settings' %}">Настройки</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>Текущая тема: {{ theme_info.name }} | Шрифт: {{ font_size }}px</p>
    </footer>
</body>
</html>
