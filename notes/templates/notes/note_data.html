{% extends "notes/base.html" %}
{% block content %}
<h2>{{ note.title }}</h2>
<p><em>Тег: {{ note.tag }}</em></p>
<p>{{ note.text }}</p>
<div style="margin-top: 20px;">
    <a href="{% url 'index' %}" style="padding: 10px 20px; background: #757575; color: white; text-decoration: none; border-radius: 4px; margin-right: 10px;">← Назад</a>
    <a href="{% url 'delete_note' note.id %}" style="padding: 10px 20px; background: #f44336; color: white; text-decoration: none; border-radius: 4px; display: inline-block;">Удалить заметку</a>
</div>
{% endblock %}
