{% extends "notes/base.html" %}
{% block content %}
<h2>Новая заметка</h2>
<form method="post">
    {% csrf_token %}
    <div style="margin-bottom: 15px;">
        <label for="id_title">{{ form.title.label }}:</label><br>
        {{ form.title }}
    </div>
    <div style="margin-bottom: 15px;">
        <label for="id_text">{{ form.text.label }}:</label><br>
        {{ form.text }}
    </div>
    <div style="margin-bottom: 15px;">
        <label for="id_tag">{{ form.tag.label }}:</label><br>
        {{ form.tag }}
    </div>
    <div class="btn-group">
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'index' %}" class="btn btn-secondary">Отмена</a>
    </div>
</form>
{% endblock %}
