{% extends "notes/base.html" %}
{% block content %}
<h2>Список заметок</h2>
<a href="{% url 'add_note' %}" style="display: inline-block; margin-bottom: 20px; padding: 10px 20px; background: #4CAF50; color: white; text-decoration: none; border-radius: 4px;">
    + Добавить заметку
</a>
<ul style="list-style: none; padding: 0;">
{% for note in notes %}
    <li style="margin-bottom: 8px;">
        <a href="{% url 'note_detail' note.id %}" style="text-decoration: none;">{{ note.title }}</a>
        <span style="margin-left: 8px; opacity: 0.6; font-size: 0.85em;">({{ note.tag }})</span>
        <form method="post" action="{% url 'delete_note' note.id %}" style="display: inline; margin-left: 8px;">
            {% csrf_token %}
            <button type="submit" class="delete-btn" title="Удалить"
                    onclick="return confirm('Удалить заметку?')">×</button>
        </form>
    </li>
{% empty %}
    <li>Заметок пока нет.</li>
{% endfor %}
</ul>
{% endblock %}
