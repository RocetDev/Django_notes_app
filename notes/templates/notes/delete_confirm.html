{% extends "notes/base.html" %}
{% block content %}
<h2>Удаление заметки</h2>
<div style="background: rgba(255, 0, 0, 0.1); padding: 20px; border-radius: 8px; margin: 20px 0;">
    <p><strong>Вы уверены, что хотите удалить эту заметку?</strong></p>
    <h3>{{ note.title }}</h3>
    <p>{{ note.text }}</p>
    <p><em>Тег: {{ note.tag }}</em></p>
</div>
<form method="post">
    {% csrf_token %}
    <button type="submit" style="background: #f44336;">Удалить</button>
    <a href="{% url 'note_detail' note.id %}" style="margin-left: 10px; padding: 10px 20px; background: #757575; color: white; text-decoration: none; border-radius: 4px;">Отмена</a>
</form>
{% endblock %}
