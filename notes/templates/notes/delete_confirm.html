{% extends "notes/base.html" %}
{% block content %}
<h2>Удаление заметки</h2>
<div style="background: rgba(255, 0, 0, 0.1); padding: 20px; border-radius: 8px; margin: 20px 0;">
    <p><strong>Вы уверены, что хотите удалить эту заметку?</strong></p>
    <h3>{{ note.title }}</h3>
    <p>{{ note.text }}</p>
    <p><em>Тег: {{ note.tag }}</em></p>
</div>
<form method="post">
    {% csrf_token %}
    <div class="btn-group">
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'note_detail' note.id %}" class="btn btn-secondary">Отмена</a>
    </div>
</form>
{% endblock %}
